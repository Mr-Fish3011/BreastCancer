<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Breast Cancer Awareness</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="output.css">
</head>
<body class="bg-pink-50 min-h-screen flex items-center justify-center">

  <div class="bg-white shadow-xl rounded-2xl p-8 w-full max-w-lg my-5">
    <!-- header -->
    <div class="text-center mb-6">
        <h2 class="text-2xl font-bold text-pink-600">Welcome Back 💗</h2>
        <p class="text-gray-500 text-sm">Login to continue spreading awareness</p>
    </div>

    <!-- Form -->
    <form action="" class="">
      <!-- Email -->
      <div class="mb-4">
        <label class="block text-gray-600 mb-1">Email</label>
        <input type="text" placeholder="Enter your e-mail"
          class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-pink-400 outline-none">
      </div>

      <!-- Password -->
        <div class="mb-2">
          <label class="block text-gray-600 mb-1">Password</label>
          <input 
            type="password" 
            placeholder="Enter your password"
            class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-pink-400 outline-none"
          >
        </div>

      <!-- Forgot -->
      <div class="text-right mb-4">
        <a href="#" class="text-sm text-pink-500 hover:underline">Forgot password?</a>
      </div>

      <!-- Button -->
      <button type="submit" class="w-full bg-pink-500 text-white py-2 rounded-lg hover:bg-pink-600 transition">
        Login
      </button>

      <!-- Footer -->
      <p class="text-center text-sm text-gray-500 mt-6">
        You don't have an account yet? <a href="signup.html" class="underline">signup</a>
      </p>
    </form>
    
  </div>

</body>
