<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Breast Cancer Awareness - Sign Up</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="./output.css">
</head>
<body class="bg-pink-50 flex items-center justify-center min-h-screen">

  <div class="bg-white shadow-xl rounded-2xl p-8 w-full max-w-lg my-5">
    
    <!-- Header -->
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-pink-600">Join the Awareness Campaign</h1>
      <p class="text-gray-600 text-sm mt-2">
        Help spread awareness and support early detection 💗
      </p>
    </div>

    <!-- Form -->
    <form>
      
      <!-- Full Name -->
      <div class="mb-4">
        <label class="block text-gray-600 mb-1">Full Name</label>
        <input type="text" placeholder="Enter your full name"
          class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-pink-400 outline-none">
      </div>

      <!-- Email -->
      <div class="mb-4">
        <label class="block text-gray-600 mb-1">Email Address</label>
        <input type="email" placeholder="Enter your email"
          class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-pink-400 outline-none">
      </div>

      <!-- Phone -->
      <div class="mb-4">
        <label class="block text-gray-600 mb-1">Phone Number</label>
        <input type="tel" placeholder="Enter your phone number"
          class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-pink-400 outline-none">
      </div>

      <!-- Age -->
      <div class="mb-4">
        <label class="block text-gray-600 mb-1">Age</label>
        <input type="number" placeholder="Enter your age"
          class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-pink-400 outline-none">
      </div>

      <!-- Gender -->
      <div class="mb-4">
        <label class="block text-gray-600 mb-1">Gender</label>
        <select class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-pink-400 outline-none">
          <option>Select gender</option>
          <option>Female</option>
          <option>Male</option>
          <option>Prefer not to say</option>
        </select>
      </div>

      <!-- Submit Button -->
      <button type="submit"
        class="w-full bg-pink-500 text-white py-2 rounded-lg hover:bg-pink-600 transition">
        Sign Up
      </button>
    </form>

    <!-- Footer -->
     <p class="text-center text-sm text-gray-500 mt-4">Already have an existing account? <a href="login.html" class="underline">login</a></p>
    <p class="text-center text-xs text-gray-500 mt-6">
      Together, we can make a difference 🎗️
    </p>

  </div>

</body>
</html>
